name: Denyut Harian & Pembersih Data Sementara (T10-08)

# APA INI: alur otomatis denyut harian dan pembersih data sementara (T10-08 — TECH_SPEC §1 & §10 / PRD M12).
#
# JADWAL:
#   - Setiap hari pukul 02:00 WIB (19:00 UTC)
#   - Pemicu manual: workflow_dispatch
#
# TUJUAN:
#   1. Denyut harian: memicu aktivitas ringan database agar proyek gratis Supabase tidak tertidur (inactivity 7 hari).
#   2. Pembersih data sementara: membersihkan log, token kadaluwarsa, dan sesi usang dengan retensi 30 hari.
#   3. Melindungi seluruh tabel operasional inti bisnis (fail-closed whitelist).
#   4. Ringkasan peringatan harian ke owner (T10-13 / PMB1-F-049): memanggil Edge
#      Function `ringkasan_harian` untuk TIAP penyewa aktif — agregasi + 1 email/hari
#      yang dijanjikan PRD M12 baris 190, tanpa tombol manual.
#   5. Peringatan batas kapasitas 70%/90% (TECH_SPEC §10 & K6 / PMB1-F-076): memanggil
#      Edge Function `peringatan_batas` — pemakaian kuota gratis dipantau otomatis,
#      bukan klaim di alat saja (pelajaran alat/pantau_batas.py).

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denyut-harian
  cancel-in-progress: false

jobs:
  denyut-dan-bersihkan:
    name: Denyut Harian & Pembersihan Terjadwal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Pasang Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Pasang pustaka alat
        run: npm ci --prefix alat

      - name: Uji-diri fail-closed denyut & pembersih
        run: python3 alat/denyut.py --uji-diri

      - name: Eksekusi denyut harian & pembersih data sementara
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 alat/denyut.py --semua

      - name: Uji-diri fail-closed pengirim ringkasan harian
        run: node alat/eksekusi-ringkasan-harian.mjs --uji-diri

      - name: Kirim ringkasan peringatan harian ke owner (T10-13 / PMB1-F-049)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node alat/eksekusi-ringkasan-harian.mjs

      - name: Uji-diri fail-closed pemantau batas kapasitas K6
        run: node alat/eksekusi-peringatan-batas.mjs --uji-diri

      - name: Periksa batas kapasitas 70%/90% via Edge peringatan_batas (PMB1-F-076)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node alat/eksekusi-peringatan-batas.mjs
