# WORKFLOW DIAGNOSTIK SEMENTARA — akan dihapus setelah penyebab kegagalan
# langkah-20 ci.yml ketemu. Tidak dipindai alat/periksa-gerbang-ci.py
# (gerbang hanya memindai ci.yml + sebar-skema.yml + sebar-halaman.yml).
name: DIAG
on: push
permissions:
  contents: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Pasang pustaka (meniru persiapan ci.yml)
        run: |
          npm ci --prefix aplikasi
          npm ci --prefix alat
      - name: Jalankan perintah langkah-20 satu per satu, laporkan lewat issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perintah=(
            "python3 _sistem/validate_system.py"
            "python3 alat/periksa-fungsi-pin.py"
            "python3 alat/periksa-roadmap.py"
            "python3 alat/periksa-fondasi-independen.py"
            "python3 alat/audit-independen.py --uji-diri"
            "python3 alat/periksa-panduan.py"
            "python3 alat/periksa-panduan.py --uji-diri"
            "python3 alat/periksa-rujukan.py"
            "python3 alat/periksa-rujukan.py --uji-diri"
            "python3 alat/periksa-temuan-audit.py"
            "python3 alat/periksa-temuan-audit.py --uji-diri"
            "python3 alat/periksa-buku-uji.py"
            "python3 alat/periksa-buku-uji.py --uji-diri"
            "python3 alat/review-pr.py --uji-diri"
            "python3 aplikasi/alat/periksa-kerapatan.py"
            "python3 aplikasi/alat/periksa-kerapatan.py --uji-diri"
            "python3 aplikasi/alat/periksa-antarmuka.py"
            "python3 aplikasi/alat/periksa-antarmuka.py --uji-diri"
            "python3 alat/periksa-rahasia.py"
            "python3 alat/periksa-rahasia.py --uji-diri"
            "python3 alat/periksa-bersih.py"
            "python3 alat/periksa-gerbang-ci.py"
            "python3 alat/periksa-kunci-kalibrasi.py"
            "python3 alat/periksa-kunci-kalibrasi.py --uji-diri"
            "python3 alat/periksa-paket.py"
            "python3 alat/periksa-paket.py --uji-diri"
            "python3 alat/lanjut-sesi.py --di-ci"
            "python3 alat/lanjut-sesi.py --uji-diri"
          )
          for p in "${perintah[@]}"; do
            echo "=== MULAI: $p"
            out=$(bash -c "$p" 2>&1)
            st=$?
            echo "$out" | tail -3
            if [ $st -ne 0 ]; then
              echo "=== GAGAL($st): $p"
              {
                echo "sha: $GITHUB_SHA"
                echo "exit: $st"
                echo "python: $(python3 -V 2>&1)"
                echo '```'
                echo "$out" | tail -80
                echo '```'
              } > /tmp/diag-body.md
              gh issue create --title "DIAG langkah20 gagal: $p" --body-file /tmp/diag-body.md || true
              exit 1
            fi
          done
          echo "SEMUA-PERINTAH-LOLOS"
