name: Naikkan Halaman ke Cloudflare (disengaja, milik pemilik)

# APA INI: membangun aplikasi lalu mengunggahnya ke Cloudflare Workers + Static Assets,
# sehingga halaman punya alamat publik `*.workers.dev`. Ini tindakan PUBLIK dan tidak bisa
# ditarik diam-diam, karena itu alurnya terpisah dari `ci.yml` dan hanya menyala kalau diminta.
#
# CARA MEMICU (satu kali saja): buat berkas penanda `aplikasi/SEBAR-HALAMAN` (berisi satu baris
# penjelasan), lalu push. Setelah hijau dan alamatnya dicatat, berkas penanda itu dihapus lagi.
#
# KUNCI YANG DIBUTUHKAN (dipasang pemilik, tidak pernah masuk repo):
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#     1) CLOUDFLARE_API_TOKEN — token Cloudflare dengan izin "Edit Cloudflare Workers"
# Nomor akun Cloudflare (bukan rahasia) sudah diisi di bawah dari
# `docs/ops/DAFTAR_KUNCI_PEMILIK_NONSECRET.md`.

on:
  push:
    paths:
      - 'aplikasi/SEBAR-HALAMAN'

permissions:
  contents: read

concurrency:
  group: sebar-halaman
  cancel-in-progress: false

jobs:
  sebar:
    name: Unggah halaman ke Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2b55bd03207235e421de6ec18837b654
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aplikasi/package-lock.json

      - name: Periksa kunci rahasia tersedia
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "RAHASIA HILANG: CLOUDFLARE_API_TOKEN belum dipasang di GitHub (Settings → Secrets and variables → Actions)."; exit 1; }

      - name: Pasang pustaka aplikasi
        working-directory: aplikasi
        run: npm ci

      - name: Bangun lalu unggah (satu perintah rilis)
        working-directory: aplikasi
        run: npm run deploy
