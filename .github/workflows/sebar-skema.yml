name: Sebar Skema ke Supabase (disengaja, milik pemilik)

# APA INI: menyebar 14 berkas migrasi di `supabase/migrations/` ke PROYEK SUPABASE NYATA
# milik pemilik (mengubah isi database). Karena itu alurnya SENGAJA terpisah dari `ci.yml`
# dan sengaja TIDAK menyala di setiap kiriman kode.
#
# CARA MEMICU (satu kali saja): buat berkas penanda `supabase/SEBAR-SKEMA` (berisi satu baris
# penjelasan), lalu push. Setelah alur ini hijau, berkas penanda itu DIHAPUS lagi sehingga
# tidak ada penyebaran tak sengaja di kiriman berikutnya.
#
# KUNCI YANG DIBUTUHKAN (dipasang pemilik, tidak pernah masuk repo):
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#     1) SUPABASE_ACCESS_TOKEN  — token pribadi dari Supabase (Account → Access Tokens)
#     2) SUPABASE_DB_PASSWORD   — kata sandi database proyek
# Nomor proyek (bukan rahasia) sudah diisi di bawah dari `docs/ops/DAFTAR_KUNCI_PEMILIK_NONSECRET.md`.
#
# AMAN URUT: langkah "Pratinjau rencana" (--dry-run) mendahului langkah penyebaran, jadi kalau
# ada migrasi yang tidak cocok, TIDAK ADA yang berubah di proyek nyata dan alur langsung merah.

on:
  push:
    paths:
      - 'supabase/SEBAR-SKEMA'

permissions:
  contents: read

concurrency:
  group: sebar-skema
  cancel-in-progress: false

jobs:
  sebar:
    name: Sebar migrasi ke proyek Supabase nyata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: bdvjirmbuqelmduztryj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Periksa kunci rahasia tersedia
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "RAHASIA HILANG: SUPABASE_ACCESS_TOKEN belum dipasang di GitHub (Settings → Secrets and variables → Actions)."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "RAHASIA HILANG: SUPABASE_DB_PASSWORD belum dipasang di GitHub (Settings → Secrets and variables → Actions)."; exit 1; }

      - name: Tautkan ke proyek Supabase
        run: npx --yes supabase@2.117.0 --yes link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Pratinjau rencana (dry-run — belum mengubah apa pun)
        run: npx --yes supabase@2.117.0 --yes db push --dry-run

      - name: Sebar migrasi
        run: npx --yes supabase@2.117.0 --yes db push

      - name: Daftar migrasi terpasang (bukti)
        run: npx --yes supabase@2.117.0 --yes migration list
